# TethysDash local stack: SQLite (no Postgres), Valkey, and Ollama.
#
#   valkey                - channel layer (viz-progress WS) + chatbot cache
#   ollama                - serves the local chat model
#   ollama-pull           - one-shot: pulls the model, then exits
#   tethysdash-provision  - one-shot: migrate + sqlite persistent store + superuser
#   tethysdash            - the web app (uvicorn / dev server), waits on the above
#
# Usage:  cp docker/.env.example docker/.env  &&  edit  &&  docker compose -f docker/docker-compose.yml up --build
name: tethysdash

services:
  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    environment:
      # Keep the model resident so a cold reload (~8s for the 5.6GB model) never
      # lands on a chat prompt. -1 = never unload; a duration like 24h self-frees
      # after a long idle. This is the single biggest latency win for a demo.
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:-24h}"
      # ornith defaults to a 256K context; sizing the KV cache to that is a large
      # memory + compute tax that chat never needs. Cap it (plenty for chat + a
      # trimmed catalog). Raise via .env if a prompt ever needs more.
      OLLAMA_CONTEXT_LENGTH: "${OLLAMA_CONTEXT_LENGTH:-8192}"
      # Faster attention + a quantized KV cache (less memory, more speed on CPU).
      OLLAMA_FLASH_ATTENTION: "${OLLAMA_FLASH_ATTENTION:-1}"
      OLLAMA_KV_CACHE_TYPE: "${OLLAMA_KV_CACHE_TYPE:-q8_0}"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
    # --- GPU (NVIDIA): uncomment to give Ollama the GPU ---
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    # Pull the model, then warm it with a throwaway generation so it is already
    # resident (paired with OLLAMA_KEEP_ALIVE) before the first real prompt. A
    # pull failure still exits non-zero (blocks the web start); only the warmup
    # is best-effort.
    entrypoint:
      - /bin/sh
      - -c
      - >
        ollama pull ${TETHYSDASH_CHAT_LOCAL_MODEL:-ornith:9b} &&
        (ollama run ${TETHYSDASH_CHAT_LOCAL_MODEL:-ornith:9b} "ok" >/dev/null 2>&1 || true)
    restart: "no"

  tethysdash-provision:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: tethysdash-portal:local
    command: ["/usr/local/bin/provision.sh"]
    env_file: [.env]
    environment: &tethys_env
      TETHYS_DB_ENGINE: django.db.backends.sqlite3
      TETHYS_DEBUG: "${TETHYS_DEBUG:-true}"
      TETHYSDASH_CHAT_LLM_HOST: "http://ollama:11434"
      TETHYSDASH_CHAT_LOCAL_MODEL: "${TETHYSDASH_CHAT_LOCAL_MODEL:-ornith:9b}"
      PORTAL_ALLOWED_HOSTS: "${PORTAL_ALLOWED_HOSTS:-localhost,127.0.0.1}"
    depends_on:
      valkey:
        condition: service_healthy
    volumes:
      - tethys-persist:/home/tethys/persist
    restart: "no"

  tethysdash:
    image: tethysdash-portal:local
    depends_on:
      tethysdash-provision:
        condition: service_completed_successfully
      ollama-pull:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    env_file: [.env]
    environment: *tethys_env
    ports:
      - "${TETHYSDASH_HOST_PORT:-8000}:8000"
    volumes:
      - tethys-persist:/home/tethys/persist
    restart: unless-stopped

volumes:
  valkey-data:
  ollama-models:
  tethys-persist:
